# master build - yours only, never pushed (private/ is in .gitignore)

MOD_ID=flashbench
MOD_NAME="FlashBench"
MOD_DESC="master build: every tool, upstream watcher on"
# no updateJson: the manager must not swap this for a public release
UPDATE_JSON=""
VERSION_SUFFIX="-master"

# master gets everything, including the heavy python tools (mtkclient).
# Deps resolve automatically. (An explicit list, not "all": data/python
# components have no `provides` and the "all" filter would skip them.)
#
# palera1n and futurerestore are intentionally not here yet: palera1n-c needs
# its git submodules initialised, and futurerestore needs a deeper tihmstar
# library stack (libipatcher, liboffsetfinder64, libinsn, libfragmentzip,
# libimg4tool). Their recipes exist; add them once those deps are packaged.
COMPONENTS="android-tools heimdall odin4 samloader-rs qdl spd_dump pacextractor \
rkdeveloptool payload-dumper-go magiskboot lz4 brotli xz sqlite curl atcmd qcdiag \
mtools exynos-usbdl penumbra mtkclient oppo_decrypt gaster \
libirecovery img4tool img3tool libimobiledevice idevice soc-bootroms unlock-wall"

FEATURES="usb doctor info forensic debug samsung ota payload avb aik modem ak3 unroot mtk unisoc oppo eng ios watch"

WATCH_DEFAULT=1
NOTIFY_DEFAULT=both

# files in here get copied over module/ when packaging
MODULE_OVERLAY=private/module
